<!doctype html>
<html lang="th">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f6f8f1" />
    <title>เข้าสู่ระบบ — Nouri</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Noto+Sans+Thai:wght@400;500;600;700&family=Playfair+Display:ital,wght@600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="login.css" />
  </head>
  <body>
    <main class="login-layout">
      <section class="login-panel">
        <a class="brand" href="index.html"><span>n</span>NOURI</a>
        <div class="welcome-copy"><p class="eyebrow">ยินดีต้อนรับกลับมา</p><h1>ดูแลตัวเอง<br /><em>ทุกวัน.</em></h1><p>บันทึกมื้ออาหาร ติดตามสารอาหาร และค้นหาเมนูที่เหมาะกับคุณ</p></div>
        <form id="login-form" novalidate>
          <label for="name">ชื่อที่ใช้สมัคร<input id="name" type="text" autocomplete="username" placeholder="ชื่อที่คุณลงทะเบียน" required /></label>
          <label for="password">รหัสผ่าน<div class="password-row"><input id="password" type="password" autocomplete="current-password" placeholder="อย่างน้อย 6 ตัวอักษร" minlength="6" required /><button type="button" id="password-toggle" aria-label="แสดงรหัสผ่าน">แสดง</button></div></label>
          <div class="form-row"><label class="remember"><input type="checkbox" id="remember" checked /> จดจำฉันไว้</label><a href="#" id="forgot-password">ลืมรหัสผ่าน?</a></div>
          <p class="form-message" id="form-message" aria-live="polite"></p>
          <button class="submit-button" type="submit">เข้าสู่ระบบ <span>→</span></button>
        </form>
        <p class="register">ยังไม่มีบัญชี? <a href="#" id="register-link">สมัครใช้งานฟรี</a></p>
      </section>
      <aside class="visual-panel" aria-label="อาหารเพื่อสุขภาพ"><div class="sun"></div><div class="food-card card-one"><b>38g</b><span>โปรตีน</span></div><div class="food-card card-two"><b>16</b><span>มื้อดี ๆ</span></div><div class="bowl-art"><i></i><i></i><i></i><i></i><i></i></div><p>อาหารดี<br /><em>เริ่มที่นี่</em></p></aside>
    </main>
    <script src="api.js"></script>
    <script src="login.js"></script>
  </body>
</html>
