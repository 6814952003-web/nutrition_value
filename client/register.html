<!doctype html>
<html lang="th">
  <head>
    <meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" /><meta name="theme-color" content="#f6f8f1" />
    <title>สมัครสมาชิก — Nouri</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" /><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Noto+Sans+Thai:wght@400;500;600;700&family=Playfair+Display:ital,wght@600;700&display=swap" rel="stylesheet" /><link rel="stylesheet" href="login.css" />
  </head>
  <body>
    <main class="login-layout"><section class="login-panel"><a class="brand" href="index.html"><span>n</span>NOURI</a><div class="welcome-copy"><p class="eyebrow">เริ่มต้นกับ Nouri</p><h1>มื้อที่ดี<br /><em>เริ่มวันนี้.</em></h1><p>สร้างบัญชีเพื่อบันทึกเมนูและดูแลสมดุลโภชนาการในแบบของคุณ</p></div><form id="register-form" novalidate><label for="name">ชื่อที่แสดง<input id="name" type="text" autocomplete="name" placeholder="ชื่อของคุณ" required /></label><label for="email">อีเมล<input id="email" type="email" autocomplete="email" placeholder="you@example.com" required /></label><label for="password">รหัสผ่าน<div class="password-row"><input id="password" type="password" autocomplete="new-password" placeholder="อย่างน้อย 6 ตัวอักษร" minlength="6" required /><button type="button" id="password-toggle" aria-label="แสดงรหัสผ่าน">แสดง</button></div></label><p class="form-message" id="form-message" aria-live="polite"></p><button class="submit-button" type="submit">สร้างบัญชี <span>→</span></button></form><p class="register">มีบัญชีอยู่แล้ว? <a href="login.html">เข้าสู่ระบบ</a></p></section><aside class="visual-panel" aria-label="อาหารเพื่อสุขภาพ"><div class="sun"></div><div class="food-card card-one"><b>16</b><span>เมนูเพื่อสุขภาพ</span></div><div class="food-card card-two"><b>75g</b><span>เป้าโปรตีน</span></div><div class="bowl-art"><i></i><i></i><i></i><i></i><i></i></div><p>กินดี<br /><em>ทุกวัน</em></p></aside></main>
    <script src="api.js"></script><script src="register.js"></script>
  </body>
</html>
